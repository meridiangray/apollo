<!doctype html>
<html lang=en data-theme=dune data-mode=light>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=apollo-token content="{{TOKEN}}">
<title>Apollo</title>
<link rel=stylesheet href=app.css>
<link rel=stylesheet href=launch/launch.css>
<link rel=stylesheet href=chat.css>
<script src=vendor/gsap-3.13.0/gsap.min.js></script>
<script src=vendor/gsap-3.13.0/DrawSVGPlugin.min.js></script>
<script src=vendor/gsap-3.13.0/Flip.min.js></script>
<script src=launch/launch.js></script>
<script src=btnlabel.js defer></script>
<script src=entity-icons.js defer></script>
<script src=app.js defer></script>
<script src=rail.js defer></script>
<script src=toast.js defer></script>
<script src=motion.js defer></script>
<script src=flowroute.js defer></script>
<script src=entitytrace.js defer></script>
<script src=pageview.js defer></script>
<script src=sources.js defer></script>
<script src=collections.js defer></script>
<script src=data.js defer></script>
<script src=agent.js defer></script>
<script src=history.js defer></script>
<script src=scrollline.js defer></script>
<script src=chat.js defer></script>
<script src=settings.js defer></script>
</head>
<body>
<header class=bar>
  <b class=brand>Apollo</b>
  <button id=home class=ib type=button title=Home aria-label=Home>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M5 12H3l9-9l9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg>
  </button>
  <nav class=recipes aria-label=Views>
    <button id=nrun class=rp type=button aria-pressed=false><span class=ic><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M7 4.5v15l12-7.5z"/></svg></span>New run</button>
    <button id=nsrc class=rp type=button aria-pressed=false><span class=ic><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg></span>Sources</button>
    <button id=ncol class=rp type=button aria-pressed=false><span class=ic><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M4 4h6v8H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 16h6v4H4z"/></svg></span>Collections</button>
    <button id=nhis class=rp type=button aria-pressed=false><span class=ic><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M12 8l0 4l2 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg></span>History</button>
  </nav>
  <span class=grow></span>
  <span id=who class="who unsigned" title="Runs are not signed"></span>
  <button id=cog class=ib type=button title=Settings aria-label=Settings aria-pressed=false>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0-6 0"/></svg>
  </button>
  <button id=mode class=ib type=button title="Light or dark" aria-label="Light or dark">
    <svg class=to-dark viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class=to-light viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round><circle cx=12 cy=12 r=4.5 /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button id=quit class=ib type=button title=Quit aria-label=Quit>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
  </button>
</header>
<main class="wrap one" id=wrap>
  <section class="panel runs">
    <h2>Runs <small id=nruns></small></h2>
    <div class=scroll id=runs-scroll>
      <ol id=runlist class=rl></ol>
    </div>
  </section>
  <section class="panel detail" id=detail>
    <div class=dhead>
      <h2 id=dname></h2>
      <div class=actions>
        <button id=folder class=btn type=button>Folder</button>
        <button id=stop class="btn danger" type=button>Stop</button>
        <button id=resume class=btn type=button title="Carry on from where it stopped, keeping the finished passes" hidden>Resume</button>
        <button id=rerun class=btn type=button title="Clear this run and start it again with the same settings">Run again</button>
        <button id=clear class=btn type=button title="Delete this run and everything it made">Clear</button>
      </div>
    </div>
    <div id=route></div>
    <div class=dline><span id=dstatus class=st></span><span id=dsub class=sub></span></div>
    <p id=dnow class=now></p>
    <div id=path class=path hidden><input id=pathtext readonly aria-label=Folder></div>
    <div id=stats class=stats></div>
    <nav class=tabs role=tablist>
      <button type=button role=tab data-tab=run>Run</button>
      <button type=button role=tab data-tab=found>Found <small></small></button>
      <button type=button role=tab data-tab=questions>Questions <small></small></button>
      <button type=button role=tab data-tab=calls>Calls <small></small></button>
      <button type=button role=tab data-tab=runs>Runs <small></small></button>
      <button type=button role=tab data-tab=raw>Raw</button>
      <button type=button role=tab data-tab=report>Report</button>
      <button type=button role=tab data-tab=data>Data</button>
    </nav>
    <div id=tabtools class=tabtools></div>
    <div id=tabbody class=tabbody></div>
  </section>
  <section class="panel cfg" id=cfgpanel></section>
  <section class="panel cfg srcp" id=srcpanel></section>
  <section class="panel cfg colp" id=colpanel></section>
  <section class="panel cfg hisp" id=hispanel></section>
  <section class="panel cfg setp" id=setpanel></section>
</main>

<dialog id=confirmdlg>
  <form method=dialog>
    <p id=confirmmsg></p>
    <div class=btns>
      <button class=btn value=no>Cancel</button>
      <button class="btn danger" value=yes id=confirmok>OK</button>
    </div>
  </form>
</dialog>
</body>
</html>
